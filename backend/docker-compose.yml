services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: utopy
      POSTGRES_USER: utopy
      POSTGRES_PASSWORD: change_me_local_only
    volumes:
      - utopy_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utopy -d utopy"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://utopy:change_me_local_only@db:5432/utopy
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  utopy_pgdata:
